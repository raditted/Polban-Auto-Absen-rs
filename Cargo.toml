[workspace]
members = ["crates/absen-core", "crates/absen-cli", "crates/absen-gui"]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"
authors = ["raditted <radithya.syabil@gmail.com>", "Haikal"]
repository = "https://github.com/raditted/Polban-Auto-Absen-rs"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3"
httpmock = "0.7"
insta = "1"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "gzip", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
