name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            packages: ""
            bin_path: target/x86_64-pc-windows-msvc/release/polban-absen.exe
            asset: polban-absen-x86_64-pc-windows-msvc.exe
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
            packages: musl-tools
            bin_path: target/x86_64-unknown-linux-musl/release/polban-absen
            asset: polban-absen-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            packages: ""
            bin_path: target/aarch64-unknown-linux-musl/release/polban-absen
            asset: polban-absen-aarch64-unknown-linux-musl
          - target: aarch64-linux-android
            os: ubuntu-latest
            use_cross: false
            use_ndk: true
            packages: ""
            bin_path: target/aarch64-linux-android/release/polban-absen
            asset: polban-absen-aarch64-linux-android
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            use_cross: true
            packages: ""
            bin_path: target/armv7-linux-androideabi/release/polban-absen
            asset: polban-absen-armv7-linux-androideabi
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            packages: ""
            bin_path: target/x86_64-apple-darwin/release/polban-absen
            asset: polban-absen-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            packages: ""
            bin_path: target/aarch64-apple-darwin/release/polban-absen
            asset: polban-absen-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Setup Rust toolchain
        if: ${{ !matrix.use_cross }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK env
        if: matrix.use_ndk
        shell: bash
        run: |
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"

      - name: Setup cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --bin polban-absen --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release --bin polban-absen --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  build-gui:
    name: Build GUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            kind: windows
            packages: ""
            asset: Polban-Presensi-Portable-Windows-x64.zip
          - target: aarch64-apple-darwin
            os: macos-latest
            kind: macos
            packages: ""
            asset: Polban-Presensi-macOS-AppleSilicon.zip
          - target: x86_64-apple-darwin
            os: macos-latest
            kind: macos
            packages: ""
            asset: Polban-Presensi-macOS-Intel.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            kind: linux
            packages: "libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libdbus-1-dev rpm"
            asset: Polban-Presensi-Linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Resolve APP_VERSION
        shell: bash
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            APP_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          echo "APP_VERSION=${APP_VERSION:-3.0.1}" >> "$GITHUB_ENV"

      - name: Install Linux GUI dependencies
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}

      - name: Build GUI release binary
        run: cargo build --release --bin polban-absen-gui --target ${{ matrix.target }}

      - name: Package Windows GUI (Portable ZIP + Inno Setup Installer)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, stage_win | Out-Null
          Copy-Item -Force "target\${{ matrix.target }}\release\polban-absen-gui.exe" "stage_win\Polban Presensi.exe"
          Compress-Archive -Path "stage_win\Polban Presensi.exe" -DestinationPath "dist\${{ matrix.asset }}" -Force
          Remove-Item -Recurse -Force stage_win

          $iscc = $null
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($cmd) {
            $iscc = $cmd.Source
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          & $iscc `
            "/DAppVersion=$env:APP_VERSION" `
            "/DBinaryPath=..\target\${{ matrix.target }}\release\polban-absen-gui.exe" `
            "/DIconPath=..\assets\app-icon.ico" `
            "/DOutputDir=..\dist" `
            "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package macOS / Linux GUI asset
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.kind }}" in
            macos)
              APP_DIR="dist/Polban Presensi.app"
              mkdir -p "${APP_DIR}/Contents/MacOS"
              cp "target/${{ matrix.target }}/release/polban-absen-gui" "${APP_DIR}/Contents/MacOS/polban-absen-gui"
              chmod +x "${APP_DIR}/Contents/MacOS/polban-absen-gui"
              mkdir -p "${APP_DIR}/Contents/Resources" icon.iconset
              for s in 16 32 128 256 512; do
                sips -z $s $s assets/app-icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
                sips -z $((s*2)) $((s*2)) assets/app-icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
              done
              iconutil -c icns icon.iconset -o "${APP_DIR}/Contents/Resources/app-icon.icns"
              rm -rf icon.iconset
              cat > "${APP_DIR}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Polban Presensi</string>
            <key>CFBundleDisplayName</key>
            <string>Polban Presensi</string>
            <key>CFBundleIdentifier</key>
            <string>id.polban.presensi</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleIconFile</key>
            <string>app-icon</string>
            <key>CFBundleExecutable</key>
            <string>polban-absen-gui</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          PLIST
              ditto -c -k --keepParent "${APP_DIR}" "dist/${{ matrix.asset }}"
              rm -rf "${APP_DIR}"
              ;;
            linux)
              STAGE_DIR="$(mktemp -d)"
              cp "target/${{ matrix.target }}/release/polban-absen-gui" "${STAGE_DIR}/polban-absen-gui"
              chmod +x "${STAGE_DIR}/polban-absen-gui"
              cp assets/app-icon.png "${STAGE_DIR}/polban-presensi.png"
              cat > "${STAGE_DIR}/polban-presensi.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Polban Presensi
          Comment=Pemantau dan pencatat presensi akademik Polban
          Exec=polban-absen-gui
          Icon=polban-presensi
          Terminal=false
          Categories=Education;Utility;
          StartupNotify=true
          StartupWMClass=polban-absen-gui
          DESKTOP
              tar -czf "dist/${{ matrix.asset }}" -C "${STAGE_DIR}" polban-absen-gui polban-presensi.desktop polban-presensi.png

              RPM_TOPDIR="$(mktemp -d)"
              RPM_VERSION="${APP_VERSION//-/.}"
              mkdir -p "${RPM_TOPDIR}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              rpmbuild -bb --target x86_64 \
                --define "_topdir ${RPM_TOPDIR}" \
                --define "app_version ${RPM_VERSION}" \
                --define "bin_path $(pwd)/target/${{ matrix.target }}/release/polban-absen-gui" \
                --define "desktop_path ${STAGE_DIR}/polban-presensi.desktop" \
                --define "icon_path $(pwd)/assets/app-icon.png" \
                --define "license_path $(pwd)/LICENSE" \
                linux/polban-presensi.spec
              cp "${RPM_TOPDIR}/RPMS/x86_64/"*.rpm "dist/Polban-Presensi-Fedora-x64.rpm"
              rm -rf "${STAGE_DIR}" "${RPM_TOPDIR}"
              ;;
          esac

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build, build-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS and Release Notes
        shell: bash
        run: |
          shopt -s nullglob
          (
            cd artifacts
            FILES=(Polban-Presensi-* polban-absen-*)
            sha256sum "${FILES[@]}" > SHA256SUMS.txt
          )

          cat > release_notes.md <<'NOTES'
          ## Unduh Aplikasi Desktop (Polban Presensi)

          | Platform | File | Keterangan |
          | --- | --- | --- |
          | **Windows (x64)** | `Polban-Presensi-Setup-Windows-x64.exe` | **Disarankan** — Installer Windows (Start Menu & opsi shortcut Desktop, tanpa perlu Admin) |
          | **Windows (x64) Portable** | `Polban-Presensi-Portable-Windows-x64.zip` | Ekstrak & jalankan langsung `Polban Presensi.exe` |
          | **macOS (Apple Silicon)** | `Polban-Presensi-macOS-AppleSilicon.zip` | Ekstrak `Polban Presensi.app` ke `/Applications` |
          | **macOS (Intel)** | `Polban-Presensi-macOS-Intel.zip` | Ekstrak `Polban Presensi.app` ke `/Applications` |
          | **Linux Fedora (x64)** | `Polban-Presensi-Fedora-x64.rpm` | Paket RPM native (`sudo dnf install ./Polban-Presensi-Fedora-x64.rpm`) |
          | **Linux (x64)** | `Polban-Presensi-Linux-x64.tar.gz` | Binary `polban-absen-gui`, ikon, dan file `.desktop` |

          <details>
          <summary>Binary Terminal CLI / TUI & Termux (<code>polban-absen-*</code>) + Checksum</summary>

          - **Windows CLI/TUI**: `polban-absen-x86_64-pc-windows-msvc.exe`
          - **Linux x64 / ARM64 (static musl)**: `polban-absen-x86_64-unknown-linux-musl`, `polban-absen-aarch64-unknown-linux-musl`
          - **Android Termux (ARM64 / ARMv7)**: `polban-absen-aarch64-linux-android`, `polban-absen-armv7-linux-androideabi`
          - **macOS (Intel / Apple Silicon)**: `polban-absen-x86_64-apple-darwin`, `polban-absen-aarch64-apple-darwin`
          - **Verifikasi Checksum**: `SHA256SUMS.txt`

          </details>
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release_notes.md
          generate_release_notes: true
