name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            packages: ""
            bin_path: target/x86_64-pc-windows-msvc/release/polban-absen.exe
            asset: polban-absen-x86_64-pc-windows-msvc.exe
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
            packages: musl-tools
            bin_path: target/x86_64-unknown-linux-musl/release/polban-absen
            asset: polban-absen-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            packages: ""
            bin_path: target/aarch64-unknown-linux-musl/release/polban-absen
            asset: polban-absen-aarch64-unknown-linux-musl
          - target: aarch64-linux-android
            os: ubuntu-latest
            use_cross: false
            use_ndk: true
            packages: ""
            bin_path: target/aarch64-linux-android/release/polban-absen
            asset: polban-absen-aarch64-linux-android
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            use_cross: true
            packages: ""
            bin_path: target/armv7-linux-androideabi/release/polban-absen
            asset: polban-absen-armv7-linux-androideabi
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            packages: ""
            bin_path: target/x86_64-apple-darwin/release/polban-absen
            asset: polban-absen-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            packages: ""
            bin_path: target/aarch64-apple-darwin/release/polban-absen
            asset: polban-absen-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Setup Rust toolchain
        if: ${{ !matrix.use_cross }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK env
        if: matrix.use_ndk
        shell: bash
        run: |
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"

      - name: Setup cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --bin polban-absen --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release --bin polban-absen --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  build-gui:
    name: Build GUI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            kind: windows
            packages: ""
            asset: polban-absen-gui-x86_64-pc-windows-msvc.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            kind: macos
            packages: ""
            asset: Polban-Presensi-macos-aarch64.zip
          - target: x86_64-apple-darwin
            os: macos-latest
            kind: macos
            packages: ""
            asset: Polban-Presensi-macos-x86_64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            kind: linux
            packages: "libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libdbus-1-dev"
            asset: polban-absen-gui-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}

      - name: Build GUI release binary
        run: cargo build --release --bin polban-absen-gui --target ${{ matrix.target }}

      - name: Package GUI asset
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.kind }}" in
            windows)
              cp "target/${{ matrix.target }}/release/polban-absen-gui.exe" "dist/${{ matrix.asset }}"
              ;;
            macos)
              APP_DIR="dist/Polban Presensi.app"
              mkdir -p "${APP_DIR}/Contents/MacOS"
              cp "target/${{ matrix.target }}/release/polban-absen-gui" "${APP_DIR}/Contents/MacOS/polban-absen-gui"
              chmod +x "${APP_DIR}/Contents/MacOS/polban-absen-gui"
              cat > "${APP_DIR}/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Polban Presensi</string>
            <key>CFBundleDisplayName</key>
            <string>Polban Presensi</string>
            <key>CFBundleIdentifier</key>
            <string>id.polban.presensi</string>
            <key>CFBundleVersion</key>
            <string>3.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>3.0.0</string>
            <key>CFBundleExecutable</key>
            <string>polban-absen-gui</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          PLIST
              ditto -c -k --keepParent "${APP_DIR}" "dist/${{ matrix.asset }}"
              ;;
            linux)
              STAGE_DIR="$(mktemp -d)"
              cp "target/${{ matrix.target }}/release/polban-absen-gui" "${STAGE_DIR}/polban-absen-gui"
              chmod +x "${STAGE_DIR}/polban-absen-gui"
              cat > "${STAGE_DIR}/polban-presensi.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Polban Presensi
          Comment=Pemantau dan pencatat presensi akademik Polban
          Exec=polban-absen-gui
          Terminal=false
          Categories=Education;Utility;
          StartupNotify=true
          DESKTOP
              tar -czf "dist/${{ matrix.asset }}" -C "${STAGE_DIR}" polban-absen-gui polban-presensi.desktop
              rm -rf "${STAGE_DIR}"
              ;;
          esac

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    needs: [build, build-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          sha256sum polban-absen-* Polban-Presensi-* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
