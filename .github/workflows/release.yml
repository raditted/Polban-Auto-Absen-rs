name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            packages: ""
            bin_path: target/x86_64-pc-windows-msvc/release/polban-absen.exe
            asset: polban-absen-x86_64-pc-windows-msvc.exe
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
            packages: musl-tools
            bin_path: target/x86_64-unknown-linux-musl/release/polban-absen
            asset: polban-absen-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            packages: ""
            bin_path: target/aarch64-unknown-linux-musl/release/polban-absen
            asset: polban-absen-aarch64-unknown-linux-musl
          - target: aarch64-linux-android
            os: ubuntu-latest
            use_cross: false
            use_ndk: true
            packages: ""
            bin_path: target/aarch64-linux-android/release/polban-absen
            asset: polban-absen-aarch64-linux-android
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            use_cross: true
            packages: ""
            bin_path: target/armv7-linux-androideabi/release/polban-absen
            asset: polban-absen-armv7-linux-androideabi
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            packages: ""
            bin_path: target/x86_64-apple-darwin/release/polban-absen
            asset: polban-absen-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            packages: ""
            bin_path: target/aarch64-apple-darwin/release/polban-absen
            asset: polban-absen-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Setup Rust toolchain
        if: ${{ !matrix.use_cross }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK env
        if: matrix.use_ndk
        shell: bash
        run: |
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"

      - name: Setup cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --bin polban-absen --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release --bin polban-absen --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          sha256sum polban-absen-* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
