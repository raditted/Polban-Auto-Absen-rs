[package]
name = "absen-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "polban-absen-gui"
path = "src/main.rs"

[dependencies]
absen-core = { path = "../absen-core" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
tray-icon = { version = "0.19", default-features = false }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
auto-launch = "0.5"
rfd = "0.15"
directories = "5"
chrono.workspace = true
flate2 = "1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "pcm"] }
thiserror.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDate",
    "NSGeometry",
    "NSObjCRuntime",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "block2",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "NSApplication",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSImageCell",
    "NSImageView",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
x11-dl = "2.21"

[dev-dependencies]
httpmock.workspace = true
