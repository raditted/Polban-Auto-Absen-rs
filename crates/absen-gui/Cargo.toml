[package]
name = "absen-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "polban-absen-gui"
path = "src/main.rs"

[dependencies]
absen-core = { path = "../absen-core" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.29"
tray-icon = "0.19"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify-rust = "4"
auto-launch = "0.5"
rfd = "0.15"
directories = "5"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
httpmock.workspace = true
